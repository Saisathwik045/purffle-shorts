name: Free cloud clips

on:
  push:
    paths:
      - cloud/sources.json
      - .github/workflows/cloud-clips.yml
      - purffle_shorts/cloud.py
  pull_request:
    paths:
      - cloud/**
      - purffle_shorts/cloud.py
      - .github/workflows/cloud-clips.yml

permissions:
  contents: read

concurrency:
  group: free-cloud-clips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.lock && pip install --no-deps -e .
      - run: python -m purffle_shorts.cloud --validate-only

# Application-source rendering and scheduled backend execution were removed.
# The retained validate job is software CI only and never transcribes or renders user jobs.
